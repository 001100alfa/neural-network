[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-coding-agent"
version = "0.1.1"
description = "All-in-one open-source terminal coding agent supporting Anthropic, OpenAI, OpenRouter, and local Ollama models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "agent", "coding-assistant", "llm", "cli", "claude", "openai", "ollama"]
authors = [{ name = "001100alfa" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development",
]
# Zero required runtime dependencies — everything uses the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.urls]
Homepage = "https://github.com/001100alfa/neural-network"
Repository = "https://github.com/001100alfa/neural-network"

[project.scripts]
aio = "aio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
