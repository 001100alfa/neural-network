name: Release

# Build the package + a portable zip and publish a GitHub Release.
# Two ways to trigger:
#   • push a version tag (vX.Y.Z), or
#   • run it manually from the Actions tab ("Run workflow") and type the version
#     — handy when tag pushes aren't available.
# Uses no marketplace actions (the repo's policy requires actions pinned to a
# full SHA): plain git + the runner's preinstalled Python and `gh` CLI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        # No default on purpose: a stale default (v0.1.0) was once accepted
        # unchanged and tagged a release wrongly. You must type the version.
        description: "Version tag to release, e.g. v0.1.6 (must match pyproject)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Check out the ref (plain git)
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Verify the tag matches the package version
        run: |
          # Guard against the version-input/package mismatch that once tagged a
          # 0.1.6 build as v0.1.0: the tag (minus a leading 'v') must equal the
          # version in pyproject.toml.
          PKG=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG=${VERSION#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag v$TAG does not match pyproject version $PKG. Bump the version or fix the tag."
            exit 1
          fi
          echo "tag and package version agree: $PKG"

      - name: Build wheel + sdist
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip build
          .venv/bin/python -m build

      - name: Portable zip (run straight from the folder, no install)
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="aio-${VERSION}/" \
            -o "dist/aio-portable-${VERSION}.zip" HEAD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "AIO ${VERSION}" \
            --generate-notes
