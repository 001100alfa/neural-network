name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# This repository's Actions policy requires every action to be pinned to a
# full-length commit SHA (tag refs like @v4 are rejected). The SHAs below were
# resolved from the official tags via `git ls-remote` and are annotated with
# the version they correspond to.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: python -m pyflakes src tests

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Run tests
        run: python -m pytest -q
