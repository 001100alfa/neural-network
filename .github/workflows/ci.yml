name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# This repository's Actions policy requires every action to be pinned to a
# full-length commit SHA (tag refs like @v4 are rejected). The SHAs below were
# resolved from the official tags via `git ls-remote` and are annotated with
# the version they correspond to.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: python -m pyflakes src tests

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Run tests with a coverage gate
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=80

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Informational: zero runtime deps, so this should stay clean; surfaced as a
    # signal rather than a hard gate (dev-tool advisories shouldn't block a PR).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: pip-audit (runtime deps only)
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          python -m pip_audit || pip-audit

  docker:
    name: docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t aio:ci .
      - name: Run and probe /health
        run: |
          docker run -d --name aio-ci -p 8765:8765 aio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health | grep -q '"status": "ok"'; then
              echo "health OK"; docker rm -f aio-ci; exit 0
            fi
            sleep 1
          done
          echo "health check failed"; docker logs aio-ci; docker rm -f aio-ci; exit 1
