name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Uses NO marketplace actions (no actions/checkout, no actions/setup-python),
# so it runs even when the repo's "Allowed actions" policy blocks them.
# Checks out with plain git and uses the runner's preinstalled Python in a
# venv (avoids PEP 668 externally-managed errors).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (plain git)
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Set up venv and install
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: .venv/bin/python -m pyflakes src tests

      - name: Run tests
        run: .venv/bin/python -m pytest -q
