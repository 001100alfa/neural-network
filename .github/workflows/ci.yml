name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# This repository's Actions policy requires every marketplace action to be
# pinned to a full commit SHA. To stay green without chasing third-party SHAs,
# this workflow uses NO marketplace actions at all: it checks out with plain
# git and uses the runner's preinstalled Python in a venv (PEP 668 safe).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (plain git, no marketplace action)
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Set up venv and install (dev extras)
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: .venv/bin/python -m pyflakes src tests

      - name: Run tests
        run: .venv/bin/python -m pytest -q
